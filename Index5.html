<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>See Your Selfie</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0b1a;--ink:#f3efff;--mute:#a79fc7;--foot:calc(168px + env(safe-area-inset-bottom));box-sizing:border-box}
*{box-sizing:border-box}
html,body{height:100%;height:100dvh;margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;overflow:hidden}
#app{position:relative;height:100%;height:100dvh;max-width:720px;margin:0 auto;overflow:hidden}
canvas{position:absolute;left:0;top:0;width:100%;height:calc(100% - var(--foot));touch-action:none}
header{position:absolute;top:0;left:0;right:0;padding:max(16px,env(safe-area-inset-top)) 12px 40px;text-align:center;background:linear-gradient(#0d0b1add,transparent);pointer-events:none}
h1{margin:0;font-size:1.6rem;font-weight:400;letter-spacing:.02em;background:linear-gradient(90deg,#ffd23f,#ff9ec7 50%,#7ad7ff);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
header p{margin:6px 0 0;font-family:"Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;font-style:italic;font-size:clamp(.9rem,4.3vw,1.32rem);font-weight:400;letter-spacing:.03em;white-space:nowrap;color:#d9c8ff}
#msg{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;padding:0 32px;color:var(--mute);line-height:1.5}
#legend{width:100%;padding:12px 12px 12px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;background:linear-gradient(transparent,#0d0b1aee)}
.chip{display:flex;align-items:center;gap:6px;font-size:.85rem;padding:5px 11px;border-radius:99px;background:#ffffff14}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
#go{font:inherit;font-size:1rem;color:#1a1030;background:linear-gradient(90deg,#ffd23f,#ff7eb6,#7ad7ff);border:0;border-radius:99px;padding:13px 28px;cursor:pointer}
#go:focus-visible{outline:3px solid #fff;outline-offset:3px}
#hint{text-align:center;padding:0 16px;font-size:.8rem;color:var(--mute);display:none}
.iconbtn{font:inherit;font-size:1.05rem;line-height:1;color:var(--ink);background:#ffffff1f;border:1px solid #ffffff33;border-radius:50%;width:38px;height:38px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.iconbtn:hover{background:#ffffff33}
#stack{position:absolute;left:0;right:0;bottom:var(--foot);display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
#stack>*{pointer-events:auto}
#capBtn{width:56px;height:56px;font-size:1.6rem;background:#ffffff26;border:1.5px solid #ffffff55;box-shadow:0 4px 18px #0006;margin-bottom:-4px}
#foot{position:absolute;left:0;right:0;bottom:0;height:var(--foot);padding:6px 12px max(8px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at 50% 0%,#2a1d52 0%,#150f2b 60%,#0d0b1a 100%);border-top:1px solid #ffffff1f;pointer-events:none}
.omrow{display:flex;align-items:center;justify-content:center;gap:clamp(12px,4vw,34px);max-width:100%}
.orn{flex:none;width:clamp(36px,9vw,110px);display:block;filter:drop-shadow(0 0 6px #ffc46a66)}
.orn svg{display:block;width:100%;height:auto}
.orn.flip{transform:scaleX(-1)}
#foot h2{margin:0;font-family:Cinzel,"Trajan Pro",Georgia,serif;font-weight:600;font-size:clamp(2rem,9vw,3.2rem);line-height:1.1;letter-spacing:.06em;white-space:nowrap;
  background:linear-gradient(100deg,#ffd23f 0%,#fff3c4 22%,#ff9ec7 45%,#b58cff 62%,#7ad7ff 80%,#ffd23f 100%);background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  animation:omShimmer 6s linear infinite,omGlow 3.2s ease-in-out infinite}
#foot p{margin:4px 0 0;font-family:"Cormorant Garamond","Palatino Linotype",Palatino,Georgia,serif;font-style:italic;font-weight:500;font-size:clamp(1rem,5vw,1.4rem);letter-spacing:.08em;white-space:nowrap;color:#e3d6ff;text-shadow:0 0 12px #b58cff88}
.contact{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:8px;padding:0 6px}
.contact a{pointer-events:auto;font-family:Cinzel,"Trajan Pro",Georgia,serif;font-weight:500;font-size:clamp(.9rem,4.4vw,1.8rem);letter-spacing:.04em;color:#fff;text-decoration:none;white-space:nowrap}
@keyframes omShimmer{to{background-position:-220% 0}}
@keyframes omGlow{0%,100%{filter:drop-shadow(0 0 6px #ffc46a66)}50%{filter:drop-shadow(0 0 16px #ff9ec7aa)}}
@media (prefers-reduced-motion:reduce){#foot h2{animation:none}}
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <header><h1>See Your Selfie</h1><p>See the original virtues shining from the soul.</p></header>
  <div id="msg">Camera off. Tap Turn on camera and allow access.</div>
  <div id="controls" style="position:absolute;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));display:flex;gap:8px;z-index:2">
    <button id="fsBtn" class="iconbtn" title="Full screen">⛶</button>
  </div>
  <label id="gsToggle" style="position:absolute;right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--mute);background:#ffffff14;padding:6px 10px;border-radius:99px;z-index:2;cursor:pointer">
    <input type="checkbox" id="greenscreen" checked style="accent-color:#ffb020">Green screen
  </label>
  <div id="stack">
    <button id="go">Turn on camera</button>
    <div id="hint"></div>
    <button id="capBtn" class="iconbtn" title="Capture photo">📷</button>
    <div id="legend"></div>
  </div>
  <footer id="foot"><div class="omrow"><span class="orn" id="ornL"></span><h2>Om Shanti</h2><span class="orn flip" id="ornR"></span></div><p>( I am a Peaceful Being )</p><div class="contact"><a href="https://www.bknj.org" target="_blank" rel="noopener">www.bknj.org</a><a href="tel:7323811533">732.381.1533</a></div></footer>
</div>
<video id="v" playsinline muted style="display:none"></video>
<script>
const VIRTUES=[["Power","#ff3b30"],["Purity","#ffb020"],["Happiness","#fff3a0"],["Love","#7dff4d"],["Peace","#5ff5e6"],["Bliss","#d67bff"],["Knowledge","#8fa8ff"]];
document.getElementById("legend").innerHTML=VIRTUES.map(v=>`<span class="chip" style="--c:${v[1]}"><i></i>${v[0]}</span>`).join("");

const cv=document.getElementById("c"),ctx=cv.getContext("2d"),vid=document.getElementById("v");
const msg=document.getElementById("msg"),go=document.getElementById("go"),hint=document.getElementById("hint");
let W=0,H=0,live=false,detector=null,busy=false,manual=false;
// forehead state (screen px), smoothed
let fx=0,fy=0,fr=40,tx=0,ty=0,tr=40,ready=false;

function resize(){const d=devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);
  if(!ready){tx=fx=W/2;ty=fy=H*.3;tr=fr=Math.min(W,H)*.2}}
addEventListener("resize",resize);resize();

const ZOOM=.78,RISE=.02; // zoom out a bit; keep the subject low enough to clear the title
function geom(){const vw=vid.videoWidth,vh=vid.videoHeight,s=Math.max(W/vw,H/vh)*ZOOM;return{vw,vh,s,dx:(W-vw*s)/2,dy:(H-vh*s)/2-H*RISE}}
const toScreen=(g,p)=>({x:W-(p.x*g.s+g.dx),y:p.y*g.s+g.dy});

// --- virtual background (replaces the real camera background) ---
const STARS=Array.from({length:90},()=>({x:Math.random(),y:Math.random(),r:.4+Math.random()*1.3,p:Math.random()*6.3,s:.5+Math.random()*1.5}));
function drawBackground(t){
  const g=ctx.createRadialGradient(W*.5,H*.32,H*.05,W*.5,H*.65,H*.9);
  g.addColorStop(0,"#5a2a12");g.addColorStop(.35,"#3d1408");g.addColorStop(.75,"#210a06");g.addColorStop(1,"#0c0402");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  STARS.forEach(st=>{const tw=.5+.5*Math.sin(t*st.s+st.p);ctx.fillStyle=`rgba(255,196,110,${.2+.5*tw})`;ctx.beginPath();ctx.arc(st.x*W,st.y*H,st.r,0,7);ctx.fill()});
}

// --- person cutout via selfie segmentation, so only you show over the virtual background ---
let segmenter=null,segReady=false,lastSegTs=-1;
const maskSmallCanvas=document.createElement("canvas"),maskSmallCtx=maskSmallCanvas.getContext("2d",{willReadFrequently:true});
const fullCanvas=document.createElement("canvas"),fullCtx=fullCanvas.getContext("2d");
const maskCanvas=document.createElement("canvas"),maskCtx=maskCanvas.getContext("2d");
const segCanvas=document.createElement("canvas"),segCtx=segCanvas.getContext("2d");
async function loadSegmenter(mp,fileset){
  segmenter=await mp.ImageSegmenter.createFromOptions(fileset,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/1/selfie_segmenter.tflite",delegate:"GPU"},runningMode:"VIDEO",outputCategoryMask:false,outputConfidenceMasks:true});
}
const gsToggle=document.getElementById("greenscreen");
let lastChromaTs=-1;
function chromaKeyCutout(){
  if(vid.readyState<2||vid.currentTime===lastChromaTs)return;
  lastChromaTs=vid.currentTime;
  const vw=vid.videoWidth,vh=vid.videoHeight;
  const fw=Math.min(vw,960),fh=Math.round(fw*vh/vw);
  if(fullCanvas.width!==fw||fullCanvas.height!==fh){fullCanvas.width=fw;fullCanvas.height=fh;segCanvas.width=fw;segCanvas.height=fh;maskCanvas.width=fw;maskCanvas.height=fh}
  fullCtx.drawImage(vid,0,0,fw,fh); // full-res color, kept crisp
  const mw=Math.min(vw,240),mh=Math.round(mw*vh/vw);
  if(maskSmallCanvas.width!==mw||maskSmallCanvas.height!==mh){maskSmallCanvas.width=mw;maskSmallCanvas.height=mh}
  maskSmallCtx.drawImage(vid,0,0,mw,mh);
  const img=maskSmallCtx.getImageData(0,0,mw,mh),d=img.data;
  for(let i=0;i<d.length;i+=4){
    const r=d[i],g=d[i+1],b=d[i+2];
    // how much this pixel looks like screen-green vs skin/hair/clothing
    const key=g-Math.max(r,b);
    // soft-edged threshold: fully opaque below 10, fully transparent above 55
    d[i+3]=255-Math.min(255,Math.max(0,(key-10)*(255/45)));
  }
  maskSmallCtx.putImageData(img,0,0);
  // upscale the small alpha mask smoothly, then cut it into the full-res color
  maskCtx.imageSmoothingEnabled=true;if(maskCtx.imageSmoothingQuality)maskCtx.imageSmoothingQuality="high";
  maskCtx.clearRect(0,0,fw,fh);maskCtx.drawImage(maskSmallCanvas,0,0,fw,fh);
  segCtx.clearRect(0,0,fw,fh);segCtx.drawImage(fullCanvas,0,0);
  segCtx.globalCompositeOperation="destination-in";segCtx.drawImage(maskCanvas,0,0);
  segCtx.globalCompositeOperation="source-over";
  segReady=true;
}
function updateCutout(){
  if(gsToggle.checked){chromaKeyCutout();return}
  if(!segmenter||vid.readyState<2||vid.currentTime===lastSegTs)return;
  lastSegTs=vid.currentTime;
  const vw=vid.videoWidth,vh=vid.videoHeight;
  const fw=Math.min(vw,960),fh=Math.round(fw*vh/vw);
  if(fullCanvas.width!==fw||fullCanvas.height!==fh){fullCanvas.width=fw;fullCanvas.height=fh;segCanvas.width=fw;segCanvas.height=fh;maskCanvas.width=fw;maskCanvas.height=fh}
  fullCtx.drawImage(vid,0,0,fw,fh); // full-res color, kept crisp
  let res;try{res=segmenter.segmentForVideo(vid,performance.now())}catch(e){return}
  const mask=res.confidenceMasks&&res.confidenceMasks[0];if(!mask)return;
  const md=mask.getAsFloat32Array(),mw=mask.width,mh=mask.height;
  if(maskSmallCanvas.width!==mw||maskSmallCanvas.height!==mh){maskSmallCanvas.width=mw;maskSmallCanvas.height=mh}
  const img=maskSmallCtx.createImageData(mw,mh),d=img.data;
  for(let i=0;i<mw*mh;i++){const a=Math.min(255,md[i]*md[i]*255*1.15);const j=i*4;d[j]=255;d[j+1]=255;d[j+2]=255;d[j+3]=a}
  maskSmallCtx.putImageData(img,0,0);
  maskCtx.imageSmoothingEnabled=true;if(maskCtx.imageSmoothingQuality)maskCtx.imageSmoothingQuality="high";
  maskCtx.clearRect(0,0,fw,fh);maskCtx.drawImage(maskSmallCanvas,0,0,fw,fh);
  segCtx.clearRect(0,0,fw,fh);segCtx.drawImage(fullCanvas,0,0);
  segCtx.globalCompositeOperation="destination-in";segCtx.drawImage(maskCanvas,0,0);
  segCtx.globalCompositeOperation="source-over";
  mask.close&&mask.close();
  segReady=true;
}

let landmarker=null,lastTs=-1;
async function loadTracker(){
  const base="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
  const mp=await import(base+"/vision_bundle.mjs");
  const fileset=await mp.FilesetResolver.forVisionTasks(base+"/wasm");
  const opts=d=>({baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",delegate:d},runningMode:"VIDEO",numFaces:1});
  try{landmarker=await mp.FaceLandmarker.createFromOptions(fileset,opts("GPU"))}
  catch(e){landmarker=await mp.FaceLandmarker.createFromOptions(fileset,opts("CPU"))}
  try{await loadSegmenter(mp,fileset)}catch(e){/* no cutout available; real background shows through instead */}
}
function detect(){
  if(!landmarker||!live||vid.readyState<2||vid.currentTime===lastTs)return;
  lastTs=vid.currentTime;
  let res;try{res=landmarker.detectForVideo(vid,performance.now())}catch(e){return}
  const L=res.faceLandmarks&&res.faceLandmarks[0];
  if(!L){return}
  const g=geom(),P=i=>toScreen(g,{x:L[i].x*g.vw,y:L[i].y*g.vh});
  const brow=P(9),top=P(10),le=P(33),re=P(263);
  // center of forehead: between the brows and the hairline
  tx=brow.x+(top.x-brow.x)*.72;ty=brow.y+(top.y-brow.y)*.72; // on the centre line of the face, a bit higher up the forehead
  tr=Math.hypot(le.x-re.x,le.y-re.y);ready=true;
}

function draw(t){
  requestAnimationFrame(draw);
  ctx.clearRect(0,0,W,H);
  drawBackground(t/1000);
  if(live&&vid.videoWidth){
    const g=geom();detect();updateCutout();
    ctx.save();ctx.translate(W,0);ctx.scale(-1,1);
    ctx.drawImage(segReady?segCanvas:vid,g.dx,g.dy,g.vw*g.s,g.vh*g.s);
    ctx.restore();
  }
  if(!live)return;
  fx+=(tx-fx)*.25;fy+=(ty-fy)*.25;fr+=(tr-fr)*.25;
  orb(fx,fy,fr,t/1000);
}

const rgba=(h,a)=>{const n=parseInt(h.slice(1),16);return`rgba(${n>>16},${n>>8&255},${n&255},${a})`};
const SPARKS=Array.from({length:110},()=>({i:Math.random()*7|0,d:.1+Math.random()*.9,o:(Math.random()-.5),p:Math.random()*6.3,s:1.2+Math.random()*2.6}));
const SPEED=.4; // radians per second, clockwise
function sparkleStar(cx,cy,s,rot,alpha,t){
  // small glittering golden star flare with fine diagonal cross
  ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);ctx.globalAlpha=alpha;
  ctx.globalCompositeOperation="lighter";
  const shimmer=t!==undefined?.75+.25*Math.sin(t*9):1;
  const arm=(len,wid)=>{ctx.beginPath();ctx.moveTo(0,-len);ctx.quadraticCurveTo(wid,0,0,len);ctx.quadraticCurveTo(-wid,0,0,-len);ctx.closePath();ctx.fill()};
  ctx.fillStyle=`rgba(255,224,120,${.95*shimmer})`;
  arm(s*1.7,s*.16);
  ctx.save();ctx.rotate(Math.PI/2);arm(s*1.7,s*.16);ctx.restore();
  ctx.fillStyle=`rgba(255,200,80,${.8*shimmer})`;
  ctx.save();ctx.rotate(Math.PI/4);arm(s*1.05,s*.07);ctx.restore();
  ctx.save();ctx.rotate(-Math.PI/4);arm(s*1.05,s*.07);ctx.restore();
  // glowing golden core
  const g=ctx.createRadialGradient(0,0,0,0,0,s*.35);
  g.addColorStop(0,"#fff8e0");g.addColorStop(.35,"rgba(255,210,90,.95)");g.addColorStop(1,"rgba(255,170,40,0)");
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,s*.35,0,7);ctx.fill();
  // glittering flecks around the star that twinkle and drift over time
  if(t!==undefined){
    for(let i=0;i<16;i++){
      const ga=i*Math.PI*2/16+t*.7,gd=s*(.9+.55*Math.sin(t*2.2+i*1.3));
      const tw=Math.max(0,Math.sin(t*6+i*2.1))**2; // sharp, sparkly on/off flicker
      if(tw<.05)continue;
      const gx=Math.cos(ga)*gd,gy=Math.sin(ga)*gd,gr=s*(.05+.08*tw);
      const gg=ctx.createRadialGradient(gx,gy,0,gx,gy,gr);
      gg.addColorStop(0,`rgba(255,245,200,${.95*tw})`);gg.addColorStop(.5,`rgba(255,210,110,${.6*tw})`);gg.addColorStop(1,"rgba(255,200,80,0)");
      ctx.fillStyle=gg;ctx.beginPath();ctx.arc(gx,gy,gr,0,7);ctx.fill();
      // tiny cross glint on the brightest flecks
      if(tw>.7){
        ctx.strokeStyle=`rgba(255,250,220,${(tw-.7)/.3*.8})`;ctx.lineWidth=Math.max(.5,gr*.15);
        ctx.beginPath();ctx.moveTo(gx-gr*1.8,gy);ctx.lineTo(gx+gr*1.8,gy);ctx.moveTo(gx,gy-gr*1.8);ctx.lineTo(gx,gy+gr*1.8);ctx.stroke();
      }
    }
  }
  ctx.restore();
}
const pxHash=(a,b,c,d)=>{let h=Math.imul(a+101,374761393)^Math.imul(b+977,668265263)^Math.imul(c+31,1274126177)^Math.imul(d+7,2246822519);h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967295};
function orb(x,y,u,t){
  const L=u*2.6,Wd=u*.2,GAP=u*.42,Leff=L-GAP,base=-Math.PI/2+t*SPEED;
  const fs=Math.max(14,Math.min(u*.3,36));
  ctx.font=`500 ${fs}px Georgia,serif`;
  let maxTw=0;VIRTUES.forEach(v=>{maxTw=Math.max(maxTw,ctx.measureText(v[0]).width)});
  ctx.save();ctx.globalCompositeOperation="lighter";
  VIRTUES.forEach((v,i)=>{
    const a=base+i*Math.PI*2/7,c=v[1];
    ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.translate(GAP,0);
    // broad V-shaped beam built from square pixels that flicker on/off. Every beam uses the
    // exact same length and width. A faint smooth base keeps the label backed so it stays readable.
    ctx.globalCompositeOperation="source-over";
    const Wmax=Math.max(Wd*3.4,fs*2.8),w0=Wd*.4;
    {
      const g=ctx.createLinearGradient(0,0,Leff,0);
      const p1=Math.max(.01,(u*.95-GAP)/Leff),p2=Math.min(.6,(u*1.4-GAP)/Leff);
      g.addColorStop(0,rgba(c,.04));g.addColorStop(p1,rgba(c,.04));g.addColorStop(p2,rgba(c,.16));g.addColorStop(.7,rgba(c,.2));g.addColorStop(1,rgba(c,0));
      ctx.fillStyle=g;ctx.beginPath();
      ctx.moveTo(0,-w0/2);ctx.lineTo(Leff,-Wmax/2);ctx.lineTo(Leff,Wmax/2);ctx.lineTo(0,w0/2);
      ctx.closePath();ctx.fill();
    }
    const px=Math.max(3,Math.round(u*.03)),cols=Math.floor(Leff/px),LV=6;
    const bc=Array.from({length:LV+1},()=>[]),bw=Array.from({length:LV+1},()=>[]);
    for(let ci=0;ci<cols;ci++){
      const d=(ci+.5)/cols,x=ci*px,hw=(w0+(Wmax-w0)*d)/2;
      const along=d>.75?Math.max(0,1-(d-.75)/.25):1;
      const rows=Math.floor(hw/px);
      for(let rj=-rows;rj<=rows;rj++){
        const y=rj*px,edge=Math.abs(y+px/2)/hw;
        if(edge>1)continue;
        const ph=pxHash(ci,rj,i,0),step=Math.floor(t*9+ph*4);
        const r=pxHash(ci,rj,i,step+1);
        let al=(1-.7*Math.pow(edge,1.5))*along;
        {const fk=Math.min(1,Math.max(0,(GAP+x+px/2-u*.95)/(u*.45)));al*=.22+.78*fk*fk*(3-2*fk);} // dimmer over the face
        al*=r<.1?.12:.5+.5*r; // random pixels dim out, others shimmer
        if(d>.75&&pxHash(ci,rj,i,99)>along+.12)continue; // pixels thin out toward the tip instead of a hard edge
        const white=(r>.94)||(Math.abs(rj)===0&&d<.9&&r>.3);
        const lv=Math.round(Math.min(1,al)*LV);
        if(lv<1)continue;
        (white?bw:bc)[lv].push(x,y);
      }
    }
    const drawBucket=(arr,color)=>{
      for(let lv=1;lv<=LV;lv++){
        const list=arr[lv];if(!list.length)continue;
        ctx.fillStyle=rgba(color,.9*lv/LV);ctx.beginPath();
        for(let k=0;k<list.length;k+=2)ctx.rect(list[k],list[k+1],px-.6,px-.6);
        ctx.fill();
      }
    };
    drawBucket(bc,c);drawBucket(bw,"#ffffff");
    // glitter flowing from the star out toward the tip of each beam
    for(let n=0;n<20;n++){
      const d=(t*(.16+pxHash(n,i,6,0)*.14)+pxHash(n,i,5,0))%1;
      const hw=(w0+(Wmax-w0)*d)/2,gx=d*Leff,gy=(pxHash(n,i,7,0)*2-1)*.85*hw;
      const tw=Math.pow(.5+.5*Math.sin(t*11+n*2.3+i),2);

    ctx.translate(Leff*labelD,0);if(Math.cos(a)<0)ctx.rotate(Math.PI);

    ctx.shadowColor=c;ctx.shadowBlur=fs*.2;ctx.fillStyle="rgba(255,255,255,.95)";ctx.fillText(v[0],0,0);
    ctx.restore();

  });

  const pulse=1+.15*Math.sin(t*4);
  sparkleStar(x,y,u*.182*pulse,-t*.6,1,t);
  ctx.restore();
}

function drawOrn(c,x,y,w,mirror){
  const k=w/132;c.save();c.translate(mirror?x+w:x,y-20*k);c.scale(mirror?-k:k,k);
  const lg=c.createLinearGradient(0,0,50,0);lg.addColorStop(0,"rgba(255,210,63,0)");lg.addColorStop(1,"#ffd23f");
  c.lineCap="round";c.lineWidth=1.5;c.strokeStyle=lg;c.shadowColor="rgba(255,196,106,.5)";c.shadowBlur=6*k;
  ORN.lines.forEach(d=>c.stroke(new Path2D(d)));
  c.fillStyle="#ffd23f";ORN.dots.forEach(d=>{c.beginPath();c.arc(d[0],d[1],d[2],0,7);c.fill()});
  const pg=c.createLinearGradient(0,6,0,35);pg.addColorStop(0,"#fff0b8");pg.addColorStop(1,"#ff9ec7");
  c.fillStyle=pg;c.strokeStyle="rgba(255,255,255,.6)";c.lineWidth=.6;c.lineJoin="round";
  ORN.petals.forEach(d=>{const p=new Path2D(d);c.fill(p);c.stroke(p)});

// whole-screen capture: title on top, camera picture with virtue chips, "Om Shanti" footer below
async function buildCapture(){
  try{await Promise.all([document.fonts.load('600 48px Cinzel'),document.fonts.load('italic 500 20px "Cormorant Garamond"')])}catch(e){}
  const d=cv.width/cv.clientWidth,W=cv.clientWidth,PH=cv.clientHeight,HH=96,FH=168,vw=innerWidth/100,cl=(a,b,c)=>Math.max(a,Math.min(c,b));
  const out=document.createElement("canvas");out.width=Math.round(W*d);out.height=Math.round((HH+PH+FH)*d);
  const c=out.getContext("2d");c.setTransform(d,0,0,d,0,0);c.fillStyle="#0d0b1a";c.fillRect(0,0,W,HH+PH+FH);
  c.textAlign="left";c.textBaseline="alphabetic";
  const gradText=(txt,cx,y,stops)=>{const w=c.measureText(txt).width,g=c.createLinearGradient(cx-w/2,0,cx+w/2,0);stops.forEach(s=>g.addColorStop(s[0],s[1]));c.fillStyle=g;c.fillText(txt,cx-w/2,y)};
  // header

  gradText("See Your Selfie",W/2,44,[[0,"#ffd23f"],[.5,"#ff9ec7"],[1,"#7ad7ff"]]);
  const hs=cl(14.4,W*.043,21.1);c.font=`italic 400 ${hs}px "Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif`;
  if("letterSpacing" in c)c.letterSpacing=".5px";
  c.fillStyle="#d9c8ff";{const t="See the original virtues shining from the soul.",w=c.measureText(t).width;c.fillText(t,(W-w)/2,72)}
  // picture
  c.drawImage(cv,0,HH,W,PH);
  // virtue chips over the bottom of the picture, like on screen
  c.font="13.6px Georgia,serif";if("letterSpacing" in c)c.letterSpacing="0px";
  const chips=VIRTUES.map(v=>({n:v[0],c:v[1],w:11+10+6+c.measureText(v[0]).width+11})),ch=27,gap=8,rows=[];let row=[],rw=0;
  chips.forEach(k=>{if(row.length&&rw+gap+k.w>W-24){rows.push(row);row=[];rw=0}rw+=(row.length?gap:0)+k.w;row.push(k)});rows.push(row);
  const lh=rows.length*(ch+gap)+24+12,lg=c.createLinearGradient(0,HH+PH-lh,0,HH+PH);
  lg.addColorStop(0,"rgba(13,11,26,0)");lg.addColorStop(1,"rgba(13,11,26,.93)");c.fillStyle=lg;c.fillRect(0,HH+PH-lh,W,lh);
  rows.forEach((r,ri)=>{
    const tw=r.reduce((a,k)=>a+k.w,0)+gap*(r.length-1);let x=(W-tw)/2;const y=HH+PH-12-(rows.length-ri)*(ch+gap)+gap;
    r.forEach(k=>{
      c.fillStyle="rgba(255,255,255,.08)";c.beginPath();c.roundRect?c.roundRect(x,y,k.w,ch,ch/2):c.rect(x,y,k.w,ch);c.fill();
      c.save();c.shadowColor=k.c;c.shadowBlur=8;c.fillStyle=k.c;c.beginPath();c.arc(x+11+5,y+ch/2,5,0,7);c.fill();c.restore();
      c.fillStyle="#f3efff";c.textBaseline="middle";c.fillText(k.n,x+11+10+6,y+ch/2+.5);c.textBaseline="alphabetic";
      x+=k.w+gap;
    });
  });
  // footer
  const fy=HH+PH;c.save();c.beginPath();c.rect(0,fy,W,FH);c.clip();
  const rg=c.createRadialGradient(W/2,fy,0,W/2,fy,Math.max(W,FH)*.75);rg.addColorStop(0,"#2a1d52");rg.addColorStop(.6,"#150f2b");rg.addColorStop(1,"#0d0b1a");
  c.fillStyle=rg;c.fillRect(0,fy,W,FH);c.fillStyle="rgba(255,255,255,.12)";c.fillRect(0,fy,W,1);
  let tf=cl(32,vw*9,51.2),ow=cl(36,vw*9,110),og=cl(12,vw*4,34);
  c.font=`600 ${tf}px Cinzel,"Trajan Pro",Georgia,serif`;if("letterSpacing" in c)c.letterSpacing=(tf*.06)+"px";
  let tw=c.measureText("Om Shanti").width,tot=ow*2+og*2+tw;
  if(tot>W-16){const f=(W-16)/tot;tf*=f;ow*=f;og*=f;c.font=`600 ${tf}px Cinzel,"Trajan Pro",Georgia,serif`;if("letterSpacing" in c)c.letterSpacing=(tf*.06)+"px";tw=c.measureText("Om Shanti").width;tot=ow*2+og*2+tw}
  const x0=(W-tot)/2,ty=fy+(FH-46)*.5-2,cy=ty-tf*.3;
  drawOrn(c,x0,cy,ow,false);drawOrn(c,x0+ow+og+tw+og,cy,ow,true);
  c.save();c.shadowColor="rgba(255,158,199,.6)";c.shadowBlur=14;
  gradText("Om Shanti",W/2,ty,[[0,"#ffd23f"],[.25,"#fff3c4"],[.5,"#ff9ec7"],[.72,"#b58cff"],[1,"#7ad7ff"]]);c.restore();
  const sf=cl(16,vw*5,22.4);c.font=`italic 500 ${sf}px "Cormorant Garamond","Palatino Linotype",Palatino,Georgia,serif`;
  if("letterSpacing" in c)c.letterSpacing=(sf*.08)+"px";
  c.save();c.shadowColor="rgba(181,140,255,.55)";c.shadowBlur=12;c.fillStyle="#e3d6ff";
  {const t="( I am a Peaceful Being )",w=c.measureText(t).width;c.fillText(t,(W-w)/2,ty+sf+8)}c.restore();
  // website (left) and phone (right)
  let cf=cl(14.4,vw*4.4,28.8);const cfont=z=>{c.font=`500 ${z}px Cinzel,"Trajan Pro",Georgia,serif`;if("letterSpacing" in c)c.letterSpacing=(z*.04)+"px"};
  cfont(cf);const w1=c.measureText("www.bknj.org").width,w2=c.measureText("732.381.1533").width;
  if(w1+w2+24>W-32){cf*=(W-32)/(w1+w2+24);cfont(cf)}
  c.fillStyle="#fff";c.fillText("www.bknj.org",16,fy+FH-14);
  {const t="732.381.1533",w=c.measureText(t).width;c.fillText(t,W-16-w,fy+FH-14)}

}
capBtn.onclick=()=>{
  const email=prompt("Email address to send this to (leave blank to skip):");
  if(email===null)return; // cancelled
  const trimmedEmail=email.trim();
  const name=prompt("Save image as:","selfie");
  if(name===null)return; // cancelled
  const filename=(name.trim()||"selfie")+".png";
  buildCapture().then(out=>out.toBlob(blob=>{
    if(!blob)return;
    const url=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=url;a.download=filename;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    const subject=encodeURIComponent('"I The Soul" - Selfie');
    const bodyText=`Thanks for Visiting us. Please feel free to check on our website BKNJ.ORG for more details and contact information. Thanks & Om Shanti ( I am a Peaceful Being)\n\n(Your photo was just downloaded as "${filename}" — please attach it here before sending; browsers don't allow pages to attach files automatically.)`;
    const body=encodeURIComponent(bodyText);
    const to=encodeURIComponent(trimmedEmail);
    const gmailUrl=`https://mail.google.com/mail/?view=cm&fs=1&to=${to}&su=${subject}&body=${body}`;
    setTimeout(()=>{window.open(gmailUrl,"_blank")},400);
  },"image/png"));
};

go.onclick=async()=>{
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:1280},height:{ideal:720}},audio:false});
    vid.srcObject=s;await vid.play();live=true;go.style.display="none";msg.style.display="none";
  }catch(e){msg.textContent="Camera unavailable. Allow camera access in your browser settings, then tap Turn on camera again.";return}
  hint.style.display="block";hint.textContent="Loading face tracking...";
  try{await loadTracker();hint.style.display="none"}
  catch(e){manual=true;hint.textContent="Face tracking could not load (check your internet connection). Drag the light to your forehead."}
};
